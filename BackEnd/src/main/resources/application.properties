server.port=${SERVER_PORT:9080}

# Mail configuration (read from environment in containers)
spring.mail.host=${SPRING_MAIL_HOST:smtp.office365.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
security.require-ssl=${SECURITY_REQUIRE_SSL:true}

# Database configurations (use service hostname 'db' in Docker Compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/amtopdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.formate_sql=true

# Secret key (do NOT commit real secrets)
jwt.secret-key=${JWT_SECRET:change_me}
